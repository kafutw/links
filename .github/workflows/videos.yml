name: 更新最新影片
on:
  schedule:
    - cron: '0 22 * * *'   # 每天台灣時間早上 6 點（他 10/28 指定）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python fetch_videos.py
      - name: 有變才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || (git commit -m "更新最新影片" && git push)
