<link rel="apple-touch-icon" href="avatar.jpg">

<style>
/* 單欄手機頁 440px：頭像置中 → 標語 → 團購／常態好物橫式卡 → 頻道數字磚 → 最新影片 → 合作 */
:root{
  --bg:#EAEDEC; --surface:#FFFFFF; --ink:#1A2526; --muted:#667577; --rule:#D9DFDE;
  --brand:#347E86; --brand-ink:#FFFFFF; --line:#06C755;
  --hot:#D4621B; --hot-soft:#FBEBDD; --soft:#E1EEED; --tint:#F1F5F4; --edge:#CAD5D4;
  --yt:#E5002D; --fb:#1877F2; --ig:#D62E6F; --xhs:#FF2442;
  --shadow:0 1px 2px rgba(20,40,40,.06),0 4px 14px rgba(20,40,40,.06);
  --ph:#CBD6D5;
  --font:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
  --num:"Barlow Condensed","Arial Narrow",var(--font);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111819; --surface:#1B2426; --ink:#E6EEEE; --muted:#9AAAAB; --rule:#2B3638;
  --brand:#5FB0B8; --brand-ink:#0F1819; --line:#2BD46F;
  --hot:#F29A55; --hot-soft:#3A2A1B; --soft:#1F3133; --tint:#E9EFEE; --edge:#3A4A49;
  --yt:#FF4D6A; --fb:#4D9BFF; --ig:#F06398; --xhs:#FF5C73;
  --shadow:0 1px 2px rgba(0,0,0,.3); --ph:#2A3A3B; color-scheme:dark}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:12px}
img{display:block;max-width:100%}
svg{display:block}
[hidden]{display:none!important}

.page{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
/* 8 號白卡分區（10/29 他選）：每一區一張白色大卡，卡跟卡之間留灰縫；卡裡的小元件用淺色底 */
.blk{background:var(--surface);border-radius:22px;padding:16px 14px;box-shadow:var(--shadow)}
.hero-blk{padding-top:22px}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.sec-t b{font-size:17px;font-weight:900;letter-spacing:.04em}
.sec-t b::before{content:"";display:inline-block;width:4px;height:15px;border-radius:2px;background:var(--brand);margin-right:8px;vertical-align:-1px}
.sec-t small{font-size:12.5px;color:var(--muted);text-align:right}
.hint{margin:10px 0 0;font-size:12.5px;color:var(--muted);text-align:center}
.row{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--tint);border:1.5px solid var(--edge);border-radius:14px;padding:11px 14px;min-height:62px}
.row span{flex:1;min-width:0}
.row b{display:block;font-size:14.5px}
.row small{display:block;font-size:12.5px;color:var(--muted)}
.row i{font-style:normal;color:var(--brand);font-weight:900;font-size:18px}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nums a{background:var(--tint);border-radius:14px;padding:10px 6px;text-align:center}
.nums b{display:block;font-family:var(--num);font-size:24px;line-height:1.1}
.nums small{font-size:11.5px;color:var(--muted)}

/* 頭部 */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.hero img{width:96px;height:96px;border-radius:50%;background:#fff;box-shadow:var(--shadow);margin-bottom:6px}
.hero h1{margin:0;font-size:21px;font-weight:900;letter-spacing:.06em}
/* 兩行簡介：每行不換行，字級跟著螢幕寬度縮，確保剛好兩行 */
.hero .bio{margin:2px 0 0;font-size:min(13px,3.5vw);line-height:1.7;color:var(--muted);white-space:nowrap}
.hero .bio b{color:var(--ink);font-weight:700}
/* 頭部頻道按鈕：一排三個（10/29 他選 11 號＋邊框）＝淺底、細框線、深色字，只有小圖示保留各平台顏色 */
.icons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;width:100%}
.icons a{height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--tint);color:var(--ink);border:1.5px solid var(--edge);font-weight:700;font-size:14px;transition:transform .15s,border-color .15s;min-width:0}
.icons a:hover{transform:translateY(-2px);border-color:var(--brand)}
.icons svg{width:20px;height:20px;flex:none}
.icons span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icons .i-line{grid-column:1/-1} .icons .i-line svg{color:var(--line)}
.icons .i-yt svg{color:var(--yt)} .icons .i-fb svg{color:var(--fb)} .icons .i-ig svg{color:var(--ig)}
.icons .x{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;background:var(--xhs);color:#fff;font-size:9.5px;font-weight:900;font-style:normal;line-height:1;flex:none}
@media (prefers-reduced-motion: reduce){.icons a{transition:none}}

/* 段落標題 */
.head{text-align:center;display:flex;flex-direction:column;gap:2px}
.head b{font-size:18px;font-weight:900;letter-spacing:.04em}
.head small{font-size:13px;color:var(--muted)}

/* 白色大按鈕 */
.btn{position:relative;display:flex;align-items:center;justify-content:center;min-height:58px;padding:10px 56px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);font-size:15px;font-weight:700;text-align:center;line-height:1.4}
.btn .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.btn .ic svg{width:20px;height:20px}
.btn small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.btn.main{min-height:72px}
.btn.main .ic{background:var(--line);color:#fff}
.btns{display:flex;flex-direction:column;gap:12px}

/* 分隔線：細線中間一架小飛機 */
.sep{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--ink);opacity:.75;margin-block:4px}
.sep::before,.sep::after{content:"";width:72px;height:1.5px;background:currentColor}
.sep svg{width:18px;height:18px}

/* 商品圖磚 */
.tiles{display:flex;flex-direction:column;gap:12px}
/* 商品卡：橫式清單卡（10/29 他從五種候選選 1）＝左邊直式小圖、右邊名稱＋狀態＋按鈕，封面不壓暗 */
.tile{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;background:var(--tint);border-radius:16px;padding:10px;scroll-margin-top:20px;transition:box-shadow .3s}
.tile.flash{box-shadow:0 0 0 3px var(--brand),0 0 0 9px rgba(52,126,134,.3)}
/* 左邊圖框（他選 7 號淺色底）：官方商品圖去背後用 contain 放進來；沒有商品圖時退回 YT 縮圖，用 cover 填滿 */
.tile .im{width:112px;height:140px;border-radius:12px;overflow:hidden;background:var(--surface);display:grid;place-items:center}
.tile .im img{width:100%;height:100%}
.tile .im img.prod{object-fit:contain;padding:4px}
.tile .im img.photo{object-fit:cover;object-position:50% 40%}
.tile .t{display:flex;flex-direction:column;gap:6px;min-width:0;padding-block:2px}
.tile .cap{font-size:15px;font-weight:700;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tile .pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--soft);color:var(--brand)}
.tile .pill.live{background:var(--hot-soft);color:var(--hot)}
.tile .pill.end{background:var(--hot);color:#fff}
.tile .code{font-size:12.5px;color:var(--muted)}
.tile .code b{color:var(--ink);letter-spacing:.04em}
.tile .go{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:999px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:13.5px}
.empty{grid-column:1/-1;text-align:center;font-size:13.5px;color:var(--muted);background:var(--tint);border-radius:16px;padding:20px 12px}

/* 頻道數字磚 */
.follow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fl{--c:var(--brand);--on:#fff;display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:12px 12px 12px 14px;min-width:0}
.fl .top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.fl .p{font-size:13px;font-weight:700;color:var(--muted)}
.fl .lg{width:30px;height:30px;border-radius:9px;background:var(--c);color:var(--on);display:grid;place-items:center;flex:none}
.fl .lg svg{width:17px;height:17px}
.fl .n{font-family:var(--num);font-size:30px;font-weight:700;line-height:1.05;letter-spacing:.01em}
.fl .n small{font-family:var(--font);font-size:12.5px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
.fl .h{font-size:14px;font-weight:700;line-height:1.4}
.fl .go{align-self:flex-start;font-size:12.5px;font-weight:700;color:var(--on);background:var(--c);border-radius:999px;padding:3px 13px}
.fl.wide{grid-column:1/-1}
.fl-blog{--c:var(--brand);--on:var(--brand-ink)}
.fl-yt{--c:var(--yt)} .fl-fb{--c:var(--fb)} .fl-ig{--c:var(--ig)} .fl-xhs{--c:var(--xhs)}
.fl-threads,.fl-tt{--c:var(--ink);--on:var(--bg)}

/* 最新影片卡 */
.vids{display:flex;flex-direction:column;gap:14px}
.vid{position:relative;display:block;aspect-ratio:16/9;max-width:100%;border-radius:20px;overflow:hidden;background:var(--ph);box-shadow:var(--shadow)}
.vid > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid::before{content:"";position:absolute;inset:0 0 auto;height:60%;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,0))}
.vid .tt{position:absolute;left:12px;right:12px;top:10px;z-index:2;display:flex;gap:9px;align-items:center;color:#fff}
.vid .tt img{width:32px;height:32px;border-radius:50%;flex:none;background:#fff}
.vid .tt span{min-width:0;font-size:14px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid .play{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);z-index:2;width:62px;height:44px;border-radius:12px;background:#FF0033;display:grid;place-items:center}
.vid .play svg{width:22px;height:22px;color:#fff}

/* 合作 */
.mail{display:flex;align-items:center;gap:8px;background:var(--tint);border:1.5px solid var(--edge);border-radius:14px;padding:8px 10px 8px 14px;min-height:62px}
.mail span{flex:1;min-width:0;font-size:15px;font-weight:500;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
.mail button{flex:none;border:0;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer}
.fine{font-size:11.5px;color:var(--muted);text-align:center;margin:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13.5px;border-radius:999px;padding:8px 16px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center;z-index:9}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.tile,.toast{transition:none}}
</style>
</head>

  tt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 3c.3 2.1 1.6 3.5 3.6 3.7v3.1c-1.3.1-2.5-.3-3.6-1v6.4c0 3.6-2.6 5.8-5.7 5.8-3.3 0-5.7-2.6-5.4-5.9.3-2.9 2.8-5 6-4.7v3.2c-1.4-.3-2.8.5-3 1.9-.2 1.5.9 2.6 2.4 2.6 1.4 0 2.5-1 2.5-2.9V3h3.2Z"/></svg>',
  xhs:'<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" fill="currentColor"/><text x="12" y="15.3" text-anchor="middle" font-size="8.5" font-weight="700" fill="var(--bg)" font-family="Noto Sans TC,sans-serif">小紅書</text></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5-11-6.5Z"/></svg>',
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const AVATAR = document.querySelector('.hero img').getAttribute('src');
let ITEMS = [];

/* ---------- 讀試算表 ---------- */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r'){
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function ytId(url){
  const m = /(?:youtu\.be\/|youtube\.com\/(?:shorts\/|watch\?(?:.*&)?v=|embed\/|live\/))([\w-]{11})/.exec(url || '');
  return m ? m[1] : '';
}
function parseDate(s){
  const m = /(\d{4})\D(\d{1,2})\D(\d{1,2})/.exec(s || '');
  return m ? new Date(+m[1], +m[2]-1, +m[3], 23, 59, 59) : null;
}
function toItems(rows){
  const head = (rows.shift() || []).map(h => h.trim());
  const col = name => head.findIndex(h => h.startsWith(name));
  const C = { no:col('編號'), name:col('商品名'), video:col('YT'), status:col('狀態'), until:col('團購截止'),
    code:head.findIndex(h => h === '折扣碼'), url:col('購買連結') >= 0 ? col('購買連結') : col('按鈕1連結'), cover:col('封面圖') };
  const g = (r, k) => C[k] >= 0 ? (r[C[k]] || '').trim() : '';
  return rows.map(r => {
    const name = g(r,'name'); if (!name) return null;
    const st = g(r,'status');
    return {
      no: g(r,'no').replace(/\D/g,''), name, video: safeUrl(g(r,'video')), url: safeUrl(g(r,'url')),
      status: /團購/.test(st) ? 'live' : /結束|下架/.test(st) ? 'ended' : 'long',
      until: g(r,'until'), code: g(r,'code'), cover: driveImg(g(r,'cover')),
    };
  }).filter(Boolean);
}
/* 表單上傳的封面是雲端硬碟連結，轉成可以直接顯示的圖片網址（資料夾要開「知道連結的人可檢視」） */
function driveImg(u){
  const m = /drive\.google\.com\/(?:open\?id=|file\/d\/|uc\?(?:export=\w+&)?id=)([\w-]{20,})/.exec(u || '');
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}=w720` : safeUrl(u);
}
function mergeItems(lists){
  const byNo = new Map(), extra = [];
  lists.flat().forEach(it => it.no ? byNo.set(it.no, it) : extra.push(it));
  return [...byNo.values(), ...extra].sort((a, b) => (+b.no || 0) - (+a.no || 0));
}

/* ---------- 畫面 ---------- */
function isOpen(it){
  if (it.status === 'ended') return false;
  if (it.status === 'live'){ const end = parseDate(it.until); return !end || end >= new Date(); }
  return true;
}
function tile(it){
  const id = ytId(it.video);
  const src = it.cover || (id ? `https://i.ytimg.com/vi/${id}/oar2.jpg` : '');
  const fallback = id && !it.cover ? `if(!this.dataset.f){this.dataset.f=1;this.src='https://i.ytimg.com/vi/${id}/hqdefault.jpg'}else this.remove()` : 'this.remove()';
  const end = it.status === 'live' ? parseDate(it.until) : null;
  const left = end ? Math.ceil((end - new Date()) / 86400000) - 1 : null;
  const date = end ? `～${end.getMonth()+1}/${end.getDate()}` : '';
  const pill = it.status === 'live' ? `<span class="pill live">團購中${esc(date)}</span>` : '<span class="pill">隨時可買</span>';
  return `<a class="tile"${it.no ? ` id="${esc(it.no)}" data-no="${esc(it.no)}"` : ''} href="${esc(it.url || it.video || '#')}" target="_blank" rel="noopener sponsored">
    <span class="im">${src ? `<img class="${it.cover ? 'prod' : 'photo'}" src="${esc(src)}" alt="" loading="lazy" onerror="${fallback}">` : ''}</span>
    <span class="t">
      <span class="cap">${esc(it.name)}</span>
      <span class="meta">${pill}${left !== null && left <= 3 ? `<span class="pill end">${left <= 0 ? '今天截止' : `剩 ${left} 天`}</span>` : ''}</span>
      ${it.code ? `<span class="code">折扣碼 <b>${esc(it.code)}</b></span>` : ''}
      <span class="go">去購買 ›</span>
    </span>
  </a>`;
}
function render(){
  const open = ITEMS.filter(isOpen);
  const live = open.filter(it => it.status === 'live'), long = open.filter(it => it.status === 'long');
  $('#live-sec').hidden = !live.length;
  $('#live').innerHTML = live.map(tile).join('');
  $('#long').innerHTML = long.length ? long.map(tile).join('')
    : `<div class="empty">${ITEMS.length ? '目前沒有上架的商品，想找什麼可以私訊 IG 問我們喔' : '商品清單暫時讀不到，可以先私訊 IG 問我們喔'}</div>`;
}
function flash(no){
  const el = document.getElementById(no);
  if (!el) return;
  el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'center'});
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 2600);
}
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2000);
}

const SHORT = { yt:'YouTube', fb:'Facebook', threads:'Threads', tt:'TikTok', ig:'Instagram', xhs:'小紅書' };
$('#icons').innerHTML = CHANNELS.filter(c => c.k !== 'blog').map(c => `<a class="i-${c.k}" href="${c.url}" target="_blank" rel="noopener" aria-label="${esc(c.name)}">${c.k === 'xhs' ? '<i class="x" aria-hidden="true">紅</i>' : ICON[c.k]}<span>${SHORT[c.k]}</span></a>`).join('')
  + `<a class="i-line" href="https://lin.ee/uaWAxc5" target="_blank" rel="noopener" aria-label="LINE 官方帳號"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.3 7.9.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.5s5.9-3.5 8.1-6C21.4 14.2 22 12.7 22 11c0-4.4-4.5-8-10-8Zm-3.6 10.6H6.4a.5.5 0 0 1-.5-.5V9a.5.5 0 0 1 1 0v3.6h1.5a.5.5 0 0 1 0 1Zm2-.5a.5.5 0 0 1-1 0V9a.5.5 0 0 1 1 0v4.1Zm4.8 0a.5.5 0 0 1-.9.3l-2-2.8v2.5a.5.5 0 0 1-1 0V9a.5.5 0 0 1 .9-.3l2 2.8V9a.5.5 0 0 1 1 0v4.1Zm3.3-2.6a.5.5 0 0 1 0 1h-1.5v1h1.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5V9a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-1.5v1h1.5Z"/></svg><span>LINE 私訊我們・合作、團購都可以問</span></a>`;
const NUMS = [['fb','7.5 萬','Facebook 粉絲'], ['ig','3.6 萬','IG 粉絲'], ['yt','251 萬','YouTube 觀看']];
$('#list').innerHTML = NUMS.map(([k, n, label]) => `<a href="${CHANNELS.find(c => c.k === k).url}" target="_blank" rel="noopener"><b>${n}</b><small>${label}</small></a>`).join('');
function renderVideos(list){ $('#vids').innerHTML = list.map(v => `<a class="vid" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">
  <img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="" loading="lazy">
  <span class="tt"><img src="${AVATAR}" alt=""><span>${esc(v.title)}</span></span>
  <span class="play">${ICON.play}</span></a>`).join(''); }
renderVideos(VIDEOS);
fetch('videos.json', {cache:'no-cache'}).then(r => r.ok ? r.json() : null)
  .then(list => { if (Array.isArray(list) && list.length) renderVideos(list); }).catch(() => {});
$('#copymail').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText('twkafka@gmail.com'); toast('已複製 Email'); }
  catch { toast('請長按信箱自己複製'); }
});

function track(no){
  if (!CLICK_URL || !no) return;
  const url = `${CLICK_URL}?no=${encodeURIComponent(no)}`;
  try { if (navigator.sendBeacon && navigator.sendBeacon(url)) return; } catch {}
  fetch(url, {method:'POST', mode:'no-cors', keepalive:true}).catch(() => {});
}
['#live', '#long'].forEach(sel => $(sel).addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (t) track(t.dataset.no);
}));

function afterLoad(){
  render();
  const m = /^#p?(\d+)$/.exec(location.hash);
  if (m) setTimeout(() => flash(String(+m[1])), 250);
}
try { ITEMS = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]'); } catch { ITEMS = []; }
if (ITEMS.length) render();
Promise.all(SHEET_GIDS.map(gid => fetch(`${SHEET_CSV}${gid}&t=${Date.now()}`, {cache:'no-store'})
    .then(r => r.ok ? r.text() : '').then(t => t ? toItems(parseCSV(t)) : []).catch(() => [])))
  .then(lists => {
    const items = mergeItems(lists);
    if (items.length){ ITEMS = items; try { localStorage.setItem(CACHE_KEY, JSON.stringify(items)); } catch {} }
  })
  .finally(afterLoad);
</script>
